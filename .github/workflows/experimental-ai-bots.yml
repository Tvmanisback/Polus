name: Experimental AI Bots Server (Among Us 19.0+)

on:
  workflow_dispatch:
  push:
    branches: [experimental/ai-bots]

permissions:
  contents: read

jobs:
  build:
    name: Build official Impostor 1.10.9 with AI bots
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Polus (includes pinned GPL bot source)
        uses: actions/checkout@v4

      - name: Checkout official Impostor 1.10.9
        uses: actions/checkout@v4
        with:
          repository: Impostor/Impostor
          ref: v1.10.9
          path: impostor-base

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Port vendored bot subsystem onto official server
        run: python3 ios/tools/port-ai-bots.py impostor-base

      - name: Build patched official Impostor server
        run: dotnet build impostor-base/src/Impostor.Server/Impostor.Server.csproj -c Release --nologo

      - name: Publish patched Linux server
        run: dotnet publish impostor-base/src/Impostor.Server/Impostor.Server.csproj -c Release -r linux-x64 --self-contained false -o package/server --nologo

      - name: Add 19.0+ config and source license
        shell: bash
        run: |
          cp ios/ai-bots/config.json package/server/config.json
          cp ios/ai-bots/LICENSE package/LICENSE
          cat > package/SOURCE-REVISION.txt <<'EOF'
          Official server base: https://github.com/Impostor/Impostor
          Official server tag: v1.10.9
          AI bot source: https://github.com/realmrhigh/among-us-llm
          AI bot source commit: a7b54c8e04d1fcafe56dd302db1557c13f60d506
          AI bot source license: GPL-3.0
          The official 1.10.9 CompatibilityManager is retained, including its 19.0 PC/mobile entries.
          AllowFutureGameVersions is enabled in the included config for later 19.0.x hotfix builds.
          Vendored source is under ios/ai-bots/vendor-*.json in the Polus repository.
          This package is experimental and is not deployed to Polus or Altare.
          EOF
          cat > package/EXPERIMENTAL-README.txt <<'EOF'
          POLUS AI BOTS - AMONG US 19.0+ EXPERIMENTAL BUILD

          This is official Impostor 1.10.9 with the AI bot subsystem ported into its server internals.
          It is a separate server executable, not a plugin DLL.

          The official 1.10.9 compatibility manager includes Among Us 19.0 PC and mobile entries.
          AllowFutureGameVersions is also enabled for later 19.0.x hotfix builds, but a bypass does
          not guarantee compatibility if Innersloth changes the network protocol.

          The built-in heuristic bot brain requires no API key.
          Host a normal lobby and type: !bots 5
          Other commands: !bots status and !bots off

          This artifact has not been tested with a real Among Us client yet. The first client test
          must use the current Among Us 19.0.1 iPad client.

          This is a separate server build. It has not been deployed to the live Polus server.
          Do not copy it over a running server or reuse the live allocation.
          A separate test host and UDP allocation are required for isolated testing.
          EOF

      - name: Package artifact
        run: |
          cd package
          zip -qr ../Polus-AI-Bots-19.0plus-linux-x64.zip .

      - name: Upload experimental artifact
        uses: actions/upload-artifact@v4
        with:
          name: Polus-AI-Bots-19.0plus-linux-x64
          path: Polus-AI-Bots-19.0plus-linux-x64.zip
          if-no-files-found: error
          retention-days: 14
