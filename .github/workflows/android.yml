name: Build Polus Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install Android workload
        run: dotnet workload install android
      - name: Restore Android mod
        run: dotnet restore android/Polus.Mod/Polus.Mod.csproj
      - name: Build Android mod
        run: dotnet build android/Polus.Mod/Polus.Mod.csproj -c Release --no-restore
      - name: Restore Android patcher
        run: dotnet restore android/Polus.Android/Polus.Android.csproj
      - name: Build Polus Android APK
        run: dotnet publish android/Polus.Android/Polus.Android.csproj -c Release -f net8.0-android35.0 -p:AndroidPackageFormat=apk
      - name: Upload Android mod assemblies
        uses: actions/upload-artifact@v4
        with:
          name: Polus-Android-Mod
          path: |
            android/Polus.Mod/bin/Release/net8.0/Polus.AndroidMod.dll
            android/Polus.Mod/bin/Release/net8.0/Polus.RoleCore.dll
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Polus-Android-LemonLoader
          path: android/Polus.Android/bin/Release/net8.0-android35.0/publish/*.apk
