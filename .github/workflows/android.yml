name: Build Polus Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Install Android workload
        run: dotnet workload install android
      - name: Restore Android mod
        run: dotnet restore android/Polus.Mod/Polus.Mod.csproj
      - name: Build Android mod
        run: dotnet build android/Polus.Mod/Polus.Mod.csproj -c Release --no-restore
      - name: Verify Android mod outputs
        run: test -s android/Polus.Mod/bin/Release/net6.0/Polus.AndroidMod.dll && test -s android/Polus.Mod/bin/Release/net6.0/Polus.RoleCore.dll
      - name: Prepare release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/polus-release.p12"
          test -s "$RUNNER_TEMP/polus-release.p12"
      - name: Restore Android patcher
        run: dotnet restore android/Polus.Android/Polus.Android.csproj
      - name: Build and sign Polus Android APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: |
          dotnet publish android/Polus.Android/Polus.Android.csproj -c Release -f net9.0-android35.0 -p:AndroidPackageFormat=apk -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$RUNNER_TEMP/polus-release.p12" -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" -p:AndroidSigningStorePass="$ANDROID_KEYSTORE_PASSWORD" -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD"
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find android/Polus.Android/bin/Release/net9.0-android35.0 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="${{ steps.apk.outputs.path }}"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK_PATH"
      - name: Capture Polus patcher UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb install "${{ steps.apk.outputs.path }}"
            adb shell monkey -p com.tvmanisback.poluscompanion 1
            sleep 12
            mkdir -p artifacts
            adb exec-out screencap -p > artifacts/polus-android-patcher.png
            test -s artifacts/polus-android-patcher.png
      - name: Upload Android UI screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Polus-Android-Patcher-Screenshot
          path: artifacts/polus-android-patcher.png
      - name: Upload Android mod assemblies
        uses: actions/upload-artifact@v4
        with:
          name: Polus-Android-Mod
          path: |
            android/Polus.Mod/bin/Release/net6.0/Polus.AndroidMod.dll
            android/Polus.Mod/bin/Release/net6.0/Polus.RoleCore.dll
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Polus-Android-LemonLoader
          path: ${{ steps.apk.outputs.path }}
