name: Build Polus iOS server package

on:
  push:
    paths:
      - "ios/Polus.ServerPlugin/**"
      - "ios/server/**"
      - ".github/workflows/polus-server-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download pinned Impostor Linux server
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.10.9"
          ASSET="Impostor-Server_${VERSION}_linux-x64.tar.gz"
          URL="https://github.com/Impostor/Impostor/releases/download/v${VERSION}/${ASSET}"
          curl --fail --location --retry 3 "${URL}" -o /tmp/impostor.tar.gz
          echo "54ff18b773fe2cb6458a67d5ae5291b35d5f9f60054ca30e6fc49f07cc784ad8  /tmp/impostor.tar.gz" | sha256sum --check
          mkdir -p package/runtime
          tar -xzf /tmp/impostor.tar.gz -C package/runtime
          chmod +x package/runtime/Impostor.Server

      - name: Build Polus plugin into Impostor plugin directory
        run: |
          set -euo pipefail
          mkdir -p package/runtime/plugins
          dotnet publish ios/Polus.ServerPlugin/Polus.ServerPlugin.csproj -c Release -o package/runtime/plugins
          test -f package/runtime/plugins/Polus.ServerPlugin.dll

      - name: Create Altare startup files
        run: |
          set -euo pipefail
          mkdir -p package
          cp ios/server/config.template.json package/config.template.json
          cat > package/start.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          cd /home/container
          PORT="${SERVER_PORT:-${SERVER_PORT_1:-25906}}"
          HOST="${SERVER_IP:-${SERVER_ADDRESS:-}}"
          if [[ -z "${HOST}" ]]; then
            HOST="$(getent ahostsv4 us-iad01.altare.global | awk 'NR==1 {print $1}')"
          fi
          if [[ -z "${HOST}" ]]; then
            echo "Could not resolve Altare public IPv4. Set SERVER_IP in Startup variables."
            exit 1
          fi
          if ! [[ "${PORT}" =~ ^[0-9]+$ ]] || (( PORT < 1 || PORT > 65535 )); then
            echo "Invalid server port: ${PORT}"
            exit 1
          fi
          if [[ ! -x runtime/Impostor.Server ]]; then
            echo "ERROR: runtime/Impostor.Server is missing or not executable."
            exit 1
          fi
          if [[ ! -f runtime/plugins/Polus.ServerPlugin.dll ]]; then
            echo "ERROR: runtime/plugins/Polus.ServerPlugin.dll is missing."
            exit 1
          fi
          cp config.template.json runtime/config.json
          python3 - "${PORT}" "${HOST}" <<'PY'
          import json, sys
          port = int(sys.argv[1])
          host = sys.argv[2]
          path = "runtime/config.json"
          with open(path, encoding="utf-8") as f:
              cfg = json.load(f)
          cfg["Server"]["PublicIp"] = host
          cfg["Server"]["PublicPort"] = port
          cfg["Server"]["ListenIp"] = "0.0.0.0"
          cfg["Server"]["ListenPort"] = port
          cfg["PluginLoader"]["Paths"] = ["plugins"]
          with open(path, "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2)
          PY
          echo "Starting Polus Impostor on ${HOST}:${PORT}"
          cd runtime
          exec ./Impostor.Server
          SCRIPT
          chmod +x package/start.sh
          cat > package/README-ALTARE.txt <<'TXT'
          POLUS iOS SERVER - ALTARE
          The archive contains the full Impostor server in runtime/ and the Polus plugin in runtime/plugins/.
          1. Extract polus-server.tar.gz into /home/container.
          2. Set Startup command to:
             tar -xzf /home/container/polus-server.tar.gz -C /home/container && bash /home/container/start.sh
          3. The allocation must allow BOTH TCP matchmaking and UDP gameplay on the same port.
          4. Set SERVER_PORT to the assigned allocation port if it is not 25906.
          5. Set SERVER_IP to the allocation's numeric public IPv4 if automatic resolution does not work.
          TXT

      - name: Verify package contents
        run: |
          set -euo pipefail
          test -x package/runtime/Impostor.Server
          test -f package/runtime/plugins/Polus.ServerPlugin.dll
          test -f package/config.template.json
          test -x package/start.sh
          find package -maxdepth 3 -type f -print | sort

      - name: Package server archive
        run: |
          tar -czf polus-server.tar.gz -C package .
          tar -tzf polus-server.tar.gz | head -100

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: polus-server
          path: polus-server.tar.gz
          if-no-files-found: error
          retention-days: 14
