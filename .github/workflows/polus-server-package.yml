name: Build Polus plugin DLLs

on:
  push:
    paths:
      - "ios/Polus.ServerPlugin/**"
      - ".github/workflows/polus-server-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build Polus plugin
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish ios/Polus.ServerPlugin/Polus.ServerPlugin.csproj \
            --configuration Release \
            --output plugin-dlls
          test -s plugin-dlls/Polus.ServerPlugin.dll
          echo "Built plugin files:"
          find plugin-dlls -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload plugin DLLs only
        uses: actions/upload-artifact@v4
        with:
          name: Polus-Plugin-DLLs
          path: plugin-dlls/
          if-no-files-found: error
          retention-days: 14
