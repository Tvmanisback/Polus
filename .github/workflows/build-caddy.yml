name: Build Caddy with IONOS DNS

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/server/Caddyfile"
      - ".github/workflows/build-caddy.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Build Caddy with IONOS DNS provider
        run: |
          mkdir -p dist
          "$(go env GOPATH)/bin/xcaddy" build --with github.com/caddy-dns/ionos
          install -m 0755 caddy dist/caddy-linux-amd64

      - name: Upload Caddy binary
        uses: actions/upload-artifact@v4
        with:
          name: caddy-linux-amd64
          path: dist/caddy-linux-amd64
          if-no-files-found: error
